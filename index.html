<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content Security Policy: scripts may only load from this origin. No inline scripts, no
      eval. (The Vite dev server relaxes this for React Fast Refresh only: see vite.config.ts.)
    -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Meridian Capital Portfolio Intelligence: an institutional portfolio analytics workstation demo running on simulated data."
    />
    <meta name="theme-color" content="#0b0e13" />
    <!-- Read by /theme-init.js; Vite fills in the value from .env at build time. -->
    <meta name="meridian-default-theme" content="%VITE_DEFAULT_THEME%" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Meridian Capital · Portfolio Intelligence</title>
    <!-- Applies the saved (or default) theme before first paint to avoid a theme flash. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Meridian Capital Portfolio Intelligence requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
